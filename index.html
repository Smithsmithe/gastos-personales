<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registra y consulta tus gastos personales.">
  <title>Registro de gastos personales</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Gastos personales</h1>
      <p>Registra tus gastos y consulta el total acumulado.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Registrar gasto</h2>
      <form id="expense-form">
        <div class="form-grid">
          <div class="form-field form-field-wide">
            <label for="description">Descripción</label>
            <input id="description" name="description" type="text" required>
          </div>
          <div class="form-field">
            <label for="amount">Valor</label>
            <input id="amount" name="amount" type="number" min="0.01" step="any" required>
          </div>
          <div class="form-field">
            <label for="category">Categoría</label>
            <select id="category" name="category" required>
              <option value="" selected disabled>Selecciona una categoría</option>
            </select>
          </div>
          <div class="form-field">
            <label for="date">Fecha</label>
            <input id="date" name="date" type="date" required>
          </div>
        </div>
        <button class="primary-button" type="submit">Guardar gasto</button>
      </form>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Gastos registrados</h2>
        <p class="total">Total general: <strong id="total-amount">0</strong></p>
      </div>
      <div class="filter-field">
        <label for="category-filter">Filtrar por categoría</label>
        <select id="category-filter">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
      <p id="empty-message" class="empty-message">Aún no hay gastos registrados.</p>
    </section>
  </main>
</body>
</html>
